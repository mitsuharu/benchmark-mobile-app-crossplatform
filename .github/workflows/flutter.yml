name: flutter

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - flutter/**
      - .swift-format
      - .xcode-version
      - scripts/swift-format.sh
      - .github/workflows/flutter.yml

# A new push supersedes the previous run.
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

# Flutter is cloned at the version flutter/.fvmrc pins, the same one FVM
# installs locally, rather than through a third-party setup action.
env:
  FLUTTER_HOME: ${{ github.workspace }}/../flutter-sdk

jobs:
  dart:
    name: dart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        working-directory: .
        run: |
          version="$(jq -r .flutter flutter/.fvmrc)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list still names `tools`, which the SDK
      # no longer has. AGP fetches the platform it compiles against itself.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Set up Flutter
        run: |
          version="$(jq -r .flutter flutter/.fvmrc)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"

      # The configuration the benchmark measures.
      - name: Build for release
        working-directory: flutter/app
        run: flutter build apk --release

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # xcodes ships on the runner image, so the Xcode versions it already
      # holds can be selected without a third-party action.
      - name: Select Xcode
        run: |
          sudo xcodes select "$(cat .xcode-version)"
          xcodebuild -version

      - name: Set up Flutter
        run: |
          version="$(jq -r .flutter flutter/.fvmrc)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"

      - name: Lint Swift
        run: ./scripts/swift-format.sh

      # The runner has no signing identity, and release (AOT) Flutter cannot
      # run on the simulator, so this builds what the benchmark measures there.
      - name: Build for the simulator
        working-directory: flutter/app
        run: flutter build ios --debug --simulator
