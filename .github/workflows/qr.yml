name: qr

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - qr/**
      - bench/scripts/make-qr-images.swift
      - .node-version
      - .swift-format
      - .xcode-version
      - scripts/swift-format.sh
      - .github/actions/setup-safe-chain/**
      - .github/workflows/qr.yml

# A new push supersedes the previous run.
concurrency:
  group: qr-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  FLUTTER_HOME: ${{ github.workspace }}/../flutter-sdk

jobs:
  dart:
    name: dart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qr/flutter/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        working-directory: .
        run: |
          version="$(jq -r .flutter qr/flutter/.fvmrc)"
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"

      # The apps read the images from their own asset directory, which is a
      # copy of qr/images that is not committed.
      - name: Sync the QR images
        working-directory: .
        run: ./qr/scripts/sync-images.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  app:
    name: expo app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qr/expo/app
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: qr/expo/app/package-lock.json

      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain

      - name: Sync the QR images
        working-directory: .
        run: ./qr/scripts/sync-images.sh

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

  ios:
    name: iOS (native)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # xcodes ships on the runner image, so the Xcode versions it already
      # holds can be selected without a third-party action.
      - name: Select Xcode
        run: |
          sudo xcodes select "$(cat .xcode-version)"
          xcodebuild -version

      - name: Lint Swift
        run: ./scripts/swift-format.sh

      - name: Sync the QR images
        run: ./qr/scripts/sync-images.sh

      - name: Generate the Xcode project
        working-directory: qr/native/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test
        working-directory: qr/native/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project QrNativeApp.xcodeproj \
            -scheme QrNativeApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  android:
    name: Android (native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: qr/native/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # The action's default package list still names `tools`, which the SDK
      # no longer has. AGP fetches the platform it compiles against itself.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Sync the QR images
        working-directory: .
        run: ./qr/scripts/sync-images.sh

      # The project commits a gradle-wrapper.jar. This checks it against the
      # checksums Gradle publishes, so a tampered wrapper cannot run here.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Caches ~/.gradle and the configuration cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test
        run: ./gradlew testDebugUnitTest

      # The configuration the benchmark measures, with R8 enabled.
      - name: Build for release
        run: ./gradlew assembleRelease
